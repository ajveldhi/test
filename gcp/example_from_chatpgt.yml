
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
    #  labels:
   # app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
    #  labels:
#    app: nginx
spec:
  #type: NodePort
  type: LoadBalancer
  selector:
    app: nginx
  ports:
  - protocol: TCP
    port: 8082          # The port exposed by the Service
    targetPort: 80    # The port the container listens on
      #    nodePort: 8082    # Port exposed on each node in the cluster (NodePort)

