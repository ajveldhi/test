
## replicaSet
apiVersion: apps/v1
kind: ReplicaSet
metadata: 
  name: ng-replicaset
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata: 
      name: nginx-pod 
      labels: 
        app: nginx
    spec:
      containers:
        - name: nginx-con
          image: nginx:latest
          ports:
            - containerPort: 80


