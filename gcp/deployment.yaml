
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: ng-deployment
  labels:
    app: nginx
  annotations: 
    kubernetes.io/change-cause: "Updating to alpine "
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata: 
      name: nginx-pod 
      labels: 
        app: nginx
    spec:
      containers:
        - name: nginx-con
          image: nginx:alpine
          ports:
            - containerPort: 80

